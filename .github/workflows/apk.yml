# Compila el APK instalable en cada push (sin cuenta de Expo): prebuild + Gradle,
# y lo publica como release build-N. La app mira la última release para avisar de
# actualizaciones y la descarga de releases/latest/download/CCAQuest.apk.
name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_url:
        description: 'Servidor de sincronización para una APK de prueba (la URL del proyecto de Supabase). Con él no se publica release.'
        required: false
        default: ''
      sync_key:
        description: 'Clave publicable de ese proyecto de Supabase (sb_publishable_…).'
        required: false
        default: ''

permissions:
  contents: write # para crear la release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # npm ci falla con el lock hecho en Windows (le faltan las opcionales @emnapi/* de Linux)
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit

      # La app compara este número con la última release para saber si hay versión nueva.
      - name: Número de compilación
        run: echo "export const BUILD = ${{ github.run_number }}; // lo escribe el workflow de la APK" > src/build.ts

      - name: Generar el proyecto Android
        run: |
          npx expo prebuild -p android --no-install
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties

      # Android bloquea http en las release: solo se permite para probar con el servidor de sincronización local.
      - name: Permitir http (solo pruebas)
        if: startsWith(inputs.sync_url, 'http://')
        run: |
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml

      # Solo ARM (todos los móviles Android reales). Release firmado con la debug.keystore
      # de la plantilla, que es siempre la misma, así que cada versión se instala encima
      # de la anterior sin perder el progreso.
      - name: Compilar
        working-directory: android
        env:
          EXPO_PUBLIC_SYNC_URL: ${{ inputs.sync_url }} # vacío en los push: sin servidor no aparece la sincronización
          EXPO_PUBLIC_SYNC_KEY: ${{ inputs.sync_key }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - run: cp android/app/build/outputs/apk/release/app-release.apk CCAQuest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CCAQuest
          path: CCAQuest.apk

      # Una APK de prueba (otra rama o con servidor de pruebas) se queda en los artefactos: si fuera
      # release, todas las apps instaladas avisarían de que hay versión nueva.
      - name: Publicar la release
        if: github.ref == 'refs/heads/main' && !inputs.sync_url
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > notes.txt
          gh release create "build-${{ github.run_number }}" CCAQuest.apk --title "CCA Quest · build ${{ github.run_number }}" --notes-file notes.txt --latest
